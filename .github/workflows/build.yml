name: Build on Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No-op on Windows: builder-util only hard-links on non-Windows platforms
      # (fs.js: `platform !== "win32" && USE_HARD_LINKS !== "false"`).
      # Needed on macOS CI: electron-builder hard-links when packing, and its
      # hard-link path only recovers from EXDEV, not EEXIST. `mac.files` in
      # electron-builder.yml makes electron-builder build a duplicate app file
      # set, so the second copy of every file hits link() on an
      # already-linked destination and the build dies with EEXIST on out/ +
      # default_userdata/. Plain copy overwrites cleanly, so the resulting
      # .app/.dmg is identical — just marginally slower to package.
      USE_HARD_LINKS: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build macOS executable
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Upload Windows build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS build artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7
          if-no-files-found: warn
